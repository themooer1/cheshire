[project]
authors = [
    {name = "Eugene Wolffe", email = "fluffy1781@gmail.com"},
]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "bleak>=2.1.1",
    "typing-extensions>=4.15.0",
]
name = "cheshire"
version = "1.0.0"
description = "API for Keepsmile, LuckyStyle, Leeleberd, and related smart lights"
readme = "README.md"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "opencv-python>=4.10",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
